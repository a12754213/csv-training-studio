name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from version import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__, 'Tag must match version.py'"
      - name: Build and verify portable history
        run: |
          git checkout -B main HEAD
          python scripts/build_release.py --with-history
          git clone --no-checkout --branch main dist/CSV_Training_Studio.bundle "$RUNNER_TEMP/history-check"
      - name: Publish downloadable ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "CSV Training Studio $RELEASE_TAG" --notes-file RELEASE_NOTES.md
