name: Streamlit Cloud browser smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual Streamlit runtime
        run: python -m pip install -r requirements.txt
      - name: Install isolated test browser and driver
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check local desktop/mobile heading and Agent pages in Chromium
        run: python scripts/check_local_ui_browser.py
      - name: Load public Streamlit app in Chromium and assert UI heading
        env:
          APP_URL: https://csv-training-studio-nz7xft3au8v8d6pcrjrnkd.streamlit.app/
        run: python scripts/check_cloud_browser.py
